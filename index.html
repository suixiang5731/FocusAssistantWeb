<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Focus Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom scrollbar for settings */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }
      
      /* Hide number input arrows */
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }
      input[type=number] {
        -moz-appearance: textfield;
      }

      /* Animations */
      @keyframes backdrop-enter {
        0% { opacity: 0; backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); }
        100% { opacity: 1; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
      }
      @keyframes backdrop-exit {
        0% { opacity: 1; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        100% { opacity: 0; backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); }
      }
      
      @keyframes modal-enter {
        0% { opacity: 0; transform: scale(0.95) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes modal-exit {
        0% { opacity: 1; transform: scale(1) translateY(0); }
        100% { opacity: 0; transform: scale(0.95) translateY(10px); }
      }

      /* Breathing Rhythm Aura Animation (4s Inhale, 4s Exhale) */
      @keyframes breath-ring {
        0%, 100% { transform: scale(1); opacity: 0.25; }
        50% { transform: scale(1.12); opacity: 0.65; }
      }

      @keyframes breath-text {
        0%, 100% { opacity: 0.6; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-1px); }
      }

      @keyframes completion-pop {
        0% { transform: scale(0.6); opacity: 0; }
        50% { transform: scale(1.08); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes ring-ripple {
        0% { transform: scale(0.9); opacity: 0.8; stroke-width: 12px; }
        100% { transform: scale(1.35); opacity: 0; stroke-width: 1px; }
      }

      .animate-breath-ring {
        animation: breath-ring 8s ease-in-out infinite;
      }
      .animate-breath-text {
        animation: breath-text 8s ease-in-out infinite;
      }
      .animate-completion-pop {
        animation: completion-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      .animate-ring-ripple {
        animation: ring-ripple 1.8s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
      }

      .animate-backdrop-enter {
        animation: backdrop-enter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-backdrop-exit {
        animation: backdrop-exit 0.3s ease-in forwards;
      }

      .animate-modal-enter {
        animation: modal-enter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-modal-exit {
        animation: modal-exit 0.3s ease-in forwards;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "date-fns": "https://aistudiocdn.com/date-fns@^4.1.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "date-fns/": "https://aistudiocdn.com/date-fns@^4.1.0/"
  }
}
</script>
</head>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
